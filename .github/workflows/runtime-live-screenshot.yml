name: ChatGPT Runtime Overview Screenshot

on:
  pull_request:
    branches: [main]
    paths:
      - .chatgpt-trigger/runtime-live-*.txt
      - .github/workflows/runtime-live-screenshot.yml

permissions:
  contents: read

concurrency:
  group: chatgpt-runtime-overview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture Runtime overview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > capture-runtime-overview.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const sourcePath = path.resolve('runtime-preview/index.html');
          const url = pathToFileURL(sourcePath).href;
          const browser = await chromium.launch({ headless: true });
          const captures = [
            { output: 'artifacts/runtime-overview-desktop.png', viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 },
            { output: 'artifacts/runtime-overview-mobile.png', viewport: { width: 430, height: 932 }, deviceScaleFactor: 2 },
          ];
          const report = [];

          for (const item of captures) {
            const context = await browser.newContext({
              viewport: item.viewport,
              deviceScaleFactor: item.deviceScaleFactor,
              locale: 'zh-CN',
              colorScheme: 'dark',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('pageerror', (error) => errors.push(String(error)));

            const response = await page.goto(url, { waitUntil: 'load', timeout: 30_000 });
            await page.waitForSelector('body[data-page="hub"]', { state: 'visible', timeout: 10_000 });
            await page.waitForSelector('.hub-row', { state: 'visible', timeout: 10_000 });
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
            });
            await page.waitForTimeout(600);
            await page.screenshot({ path: item.output, fullPage: true, animations: 'disabled' });
            report.push({
              source: 'repository-derived Runtime overview structure and current console visual variables',
              productionData: false,
              deployedRuntimeProbe: 'HTTP 404 from GitHub-hosted Runner',
              output: item.output,
              viewport: item.viewport,
              title: await page.title(),
              navigationStatus: response?.status() ?? null,
              consoleErrors: errors,
            });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('artifacts/capture-report.json', JSON.stringify(report, null, 2));
          EOF
          node ./capture-runtime-overview.mjs
          ls -lh artifacts

      - name: Upload Runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-overview-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error
